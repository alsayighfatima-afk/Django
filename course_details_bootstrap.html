{% extends "onlinecourse/base.html" %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <h1 class="display-4">{{ course.name }}</h1>
    <p class="lead">{{ course.description }}</p>
    
    <h3 class="mt-5">Lessons</h3>
    <div class="list-group">
        {% for lesson in course.lesson_set.all %}
            <a href="#" class="list-group-item list-group-item-action">
                {{ lesson.title }}
            </a>
        {% endfor %}
    </div>

    <div class="mt-4">
        <a href="{% url 'onlinecourse:submit' course.id %}" class="btn btn-primary btn-lg">Take Exam</a>
    </div>
</div>
{% endblock %}
